{% extends "base.html" %}

{% block title %}500 - System Error - SecureShare{% endblock %}

{% block content %}
<div class="error-wrapper">
    <div class="error-card">
        <div class="error-shield-badge">
            <i data-lucide="alert-triangle"></i>
        </div>
        <div class="error-code">500</div>
        <h2>Internal Server Error</h2>
        <p class="error-desc">An unexpected server exception occurred. The database session has been rolled back safely.</p>
        <div class="error-actions">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                <i data-lucide="arrow-left"></i>
                <span>Return to Dashboard</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
