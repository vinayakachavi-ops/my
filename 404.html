{% extends "base.html" %}

{% block title %}404 - Not Found - SecureShare{% endblock %}

{% block content %}
<div class="error-wrapper">
    <div class="error-card">
        <div class="error-shield-badge">
            <i data-lucide="help-circle"></i>
        </div>
        <div class="error-code">404</div>
        <h2>Resource Not Found</h2>
        <p class="error-desc">The file, route, or resource you requested could not be located in the vault.</p>
        <div class="error-actions">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                <i data-lucide="arrow-left"></i>
                <span>Return to Dashboard</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
